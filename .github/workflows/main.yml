name: Job Monitor

  "on":
    schedule:
      - cron: '*/30 * * * *'
    workflow_dispatch:

  jobs:
    monitor:
      runs-on: ubuntu-latest
      permissions:
        contents: write

      steps:
        - name: Checkout repo
          uses: actions/checkout@v4

        - name: Set up Python
          uses: actions/setup-python@v5
          with:
            python-version: '3.11'

        - name: Install dependencies
          run: pip install -r requirements.txt

        - name: Run job monitor
          env:
            TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
            TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
            CLAUDE_API_KEY:   ${{ secrets.CLAUDE_API_KEY }}
          run: python main.py

        - name: Save updated job tracker
          run: |
            git config user.name  "Job Monitor Bot"
            git config user.email "bot@jobmonitor.local"
            git add seen_jobs.json application_log.csv || true
            git diff --staged --quiet || git commit -m "chore: update job tracker [skip ci]"
            git push
